    <link rel="stylesheet" href="/shared/casino-theme.css?v=3">
    <style>
        /* Brand tokens (gold, cream, fonts) live in /shared/casino-theme.css.
           The lobby runs a darker, quieter surface than the felt tables so it
           reads as the room the games sit in, not another table. */
        :root {
            --lobby-bg: #060c09;
            /* tiles sit on their own raised surface — a clear step up from the
               page, or the grid reads as flat empty space */
            --tile-bg: #151d18;
            --tile-bg-hi: #1d2620;
            --lobby-raise: rgba(245, 235, 216, 0.06);
            --hairline: rgba(var(--gold-rgb), 0.16);
            --hairline-hi: rgba(var(--gold-rgb), 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background: var(--lobby-bg);
            color-scheme: dark;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            color: var(--text);
            font-family: var(--font-body);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            background:
                radial-gradient(120% 70% at 50% -10%, rgba(26, 92, 57, 0.28) 0%, transparent 62%),
                var(--lobby-bg);
            background-attachment: fixed;
        }

        a { color: inherit; }
        img, svg { display: block; max-width: 100%; }

        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .wrap {
            width: min(100%, var(--max));
            margin: 0 auto;
            padding: 0 clamp(20px, 4vw, 40px);
        }

        :focus-visible {
            outline: 1px solid var(--gold);
            outline-offset: 3px;
        }

        /* ── masthead ─────────────────────────────────────────── */
        .masthead {
            padding: clamp(56px, 9vw, 104px) 0 clamp(28px, 4vw, 40px);
        }

        h1 {
            font-family: var(--font-display);
            font-weight: 500;
            font-size: clamp(3rem, 8vw, 5.5rem);
            line-height: 0.95;
            letter-spacing: -0.02em;
            color: var(--cream);
        }

        .masthead-rule {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: clamp(22px, 3vw, 32px);
        }

        .masthead-rule::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--hairline), transparent);
        }

        /* Suits are drawn, not typed: the ♠♥♦♣ characters get picked up by the
           OS colour-emoji face on macOS/Android, which ignores `color`. */
        .suits {
            display: flex;
            gap: 12px;
            color: rgba(var(--gold-rgb), 0.5);
        }

        .suits svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        /* ── ledger (shared bankroll + stats) ─────────────────── */
        .ledger {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
            align-items: end;
            gap: clamp(18px, 3vw, 44px);
            padding: clamp(20px, 3vw, 26px) 0 clamp(22px, 3vw, 28px);
            border-bottom: 1px solid var(--hairline);
        }

        .figure-label {
            display: block;
            color: var(--quiet);
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .figure-value {
            display: block;
            margin-top: 6px;
            font-family: var(--font-display);
            font-weight: 500;
            font-size: clamp(1.5rem, 3vw, 2rem);
            line-height: 1.05;
            color: var(--cream);
            font-variant-numeric: tabular-nums;
        }

        .figure-value.is-positive { color: #7fd9ab; }
        .figure-value.is-negative { color: #e28a82; }

        .ledger-account {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .ledger-account input {
            width: 130px;
            padding: 7px 0;
            border: none;
            border-bottom: 1px solid var(--hairline);
            background: none;
            color: var(--cream);
            font: inherit;
            font-size: 0.85rem;
            text-align: right;
        }

        .ledger-account input::placeholder { color: var(--quiet); }

        .ledger-account input:focus {
            outline: none;
            border-bottom-color: var(--gold);
        }

        .ledger-reset {
            border: none;
            background: none;
            padding: 7px 0;
            color: var(--quiet);
            font: inherit;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 160ms ease;
        }

        .ledger-reset:hover,
        .ledger-reset:focus-visible { color: var(--gold); }

        /* ── game tiles ───────────────────────────────────────── */
        .tiles {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1px;
            background: var(--hairline);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
        }

        .tile {
            position: relative;
            isolation: isolate;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 40px;
            min-height: 236px;
            padding: clamp(28px, 4vw, 40px);
            overflow: hidden;
            background: var(--tile-bg);
            text-decoration: none;
            transition: background 220ms ease;
        }

        .tile:hover,
        .tile:focus-visible { background: var(--tile-bg-hi); }

        /* the suit reads as a watermark, not decoration */
        .tile-mark {
            position: absolute;
            top: 0;
            bottom: 0;
            right: -44px;
            margin: auto 0;
            z-index: -1;
            width: 200px;
            height: 200px;
            fill: currentColor;
            color: rgba(var(--gold-rgb), 0.07);
            transition: color 260ms ease, transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        .tile::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -2;
            background: linear-gradient(150deg, var(--lobby-raise), transparent 58%);
            opacity: 0;
            transition: opacity 220ms ease;
        }

        .tile:hover::before,
        .tile:focus-visible::before { opacity: 1; }

        /* a hairline of gold draws across the top edge on hover */
        .tile::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, var(--gold), transparent 70%);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 340ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        .tile:hover::after,
        .tile:focus-visible::after { transform: scaleX(1); }

        .tile:hover .tile-mark,
        .tile:focus-visible .tile-mark {
            color: rgba(var(--gold-rgb), 0.1);
            transform: translate3d(-10px, 0, 0);
        }

        .tile-title {
            font-family: var(--font-display);
            font-weight: 500;
            font-size: clamp(1.7rem, 3.2vw, 2.25rem);
            line-height: 1.1;
            letter-spacing: -0.01em;
            color: var(--cream);
        }

        .tile-meta {
            margin-top: 12px;
            color: rgba(var(--gold-rgb), 0.72);
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .tile-foot {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--quiet);
            font-size: 0.74rem;
            font-variant-numeric: tabular-nums;
        }

        .tile-record:empty { display: none; }

        .tile-go {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: none;
            width: 34px;
            height: 34px;
            border: 1px solid var(--hairline);
            border-radius: 50%;
            color: var(--cream);
            transition: border-color 200ms ease, background 200ms ease, color 200ms ease, transform 260ms ease;
        }

        .tile-go svg {
            width: 14px;
            height: 14px;
        }

        .tile--utility {
            grid-column: 1 / -1;
            min-height: 190px;
        }

        .tile:hover .tile-go,
        .tile:focus-visible .tile-go {
            border-color: var(--gold);
            background: var(--gold);
            color: var(--ink);
            transform: translateX(4px);
        }

        /* ── footer ───────────────────────────────────────────── */
        footer {
            padding: 28px 0 44px;
            color: var(--quiet);
            font-size: 0.76rem;
        }

        .footer-inner {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        footer a { text-decoration: none; }
        footer a:hover { color: var(--cream); }

        @media (max-width: 860px) {
            .ledger {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 22px;
            }
            .ledger-account {
                grid-column: 1 / -1;
                justify-content: space-between;
                padding-top: 4px;
                border-top: 1px solid var(--hairline);
            }

            .ledger-account input {
                flex: 1;
                width: auto;
                text-align: left;
            }
        }

        @media (max-width: 640px) {
            .tiles { grid-template-columns: minmax(0, 1fr); }
            .tile { min-height: 0; gap: 30px; }
            .tile--utility { grid-column: auto; }
            .tile-mark { width: 132px; height: 132px; top: 18px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body class="theme-casino">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <symbol id="suit-spade" viewBox="0 0 100 100">
            <path d="M50 8C50 8 12 37 12 60c0 12 9 21 20 21 6 0 11-2 15-7-1 12-5 21-13 28h32c-8-7-12-16-13-28 4 5 9 7 15 7 11 0 20-9 20-21C88 37 50 8 50 8Z"/>
        </symbol>
        <symbol id="suit-heart" viewBox="0 0 100 100">

            <circle cx="27" cy="55" r="17"/>

        </symbol>
    </svg>

    <header class="masthead">
        <div class="wrap">
            <h1>Casino</h1>
            <div class="masthead-rule">
                <span class="suits" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#suit-spade"/></svg><svg viewBox="0 0 100 100"><use href="#suit-heart"/></svg><svg viewBox="0 0 100 100"><use href="#suit-diamond"/></svg><svg viewBox="0 0 100 100"><use href="#suit-club"/></svg></span>
            </div>
        </div>
    </header>

    <main>
        <div class="wrap">
            <section class="ledger" id="yourHouse" aria-label="Your bankroll" hidden>
                <div>
                    <span class="figure-label">Bankroll</span>
                    <span class="figure-value" id="statBankroll">$0</span>
                </div>
                <div>
                    <span class="figure-label">Hands</span>
                    <span class="figure-value" id="statHands">0</span>
                </div>
                <div>
                    <span class="figure-label">Net</span>
                    <span class="figure-value" id="statNet">$0</span>
                </div>
                <div>
                    <span class="figure-label">Best</span>
                    <span class="figure-value" id="statBiggest">$0</span>
                </div>
                <div class="ledger-account">
                    <input type="text" id="yourHouseName" maxlength="24" autocomplete="off" spellcheck="false" placeholder="Your name" aria-label="Your name">
                    <button type="button" class="ledger-reset" id="yourHouseReset">Reset</button>
                </div>
            </section>

            <section class="tiles" aria-labelledby="games-title">
                <h2 id="games-title" class="sr-only">Games</h2>
                <a href="/poker/" class="tile" data-game="poker">
                    <svg class="tile-mark" viewBox="0 0 100 100" aria-hidden="true"><use href="#suit-spade"/></svg>
                    <div>
                        <h3 class="tile-title">Texas Hold'em</h3>
                        <p class="tile-meta">No-Limit · Six seats</p>
                    </div>
                    <div class="tile-foot">
                        <span class="tile-go" aria-hidden="true">
                            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5"/></svg>
                        </span>
                        <span class="tile-record" data-record></span>
                    </div>
                </a>

                <a href="/craps/" class="tile" data-game="craps">
                    <svg class="tile-mark" viewBox="0 0 100 100" aria-hidden="true"><use href="#suit-heart"/></svg>
                    <div>
                        <h3 class="tile-title">Craps</h3>
                        <p class="tile-meta">Pass · Come · Field</p>
                    </div>
                    <div class="tile-foot">
                        <span class="tile-go" aria-hidden="true">
                            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5"/></svg>
                        </span>
                        <span class="tile-record" data-record></span>
                    </div>
                </a>

                <a href="/blackjack/" class="tile" data-game="blackjack">
                    <svg class="tile-mark" viewBox="0 0 100 100" aria-hidden="true"><use href="#suit-club"/></svg>
                    <div>
                        <h3 class="tile-title">Blackjack</h3>
                        <p class="tile-meta">Six-deck shoe</p>
                    </div>
                    <div class="tile-foot">
                        <span class="tile-go" aria-hidden="true">
                            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5"/></svg>
                        </span>
                        <span class="tile-record" data-record></span>
                    </div>
                </a>

                <a href="/high-card-flush/" class="tile" data-game="high-card-flush">
                    <svg class="tile-mark" viewBox="0 0 100 100" aria-hidden="true">
                        <path d="M20 20h42a7 7 0 0 1 7 7v58H27a7 7 0 0 1-7-7V20Z" opacity=".65"/>
                        <path d="M34 12h42a7 7 0 0 1 7 7v58H69V27a7 7 0 0 0-7-7H34v-8Z"/>
                    </svg>
                    <div>
                        <h3 class="tile-title">High Card Flush</h3>
                        <p class="tile-meta">Seven cards · Bonus wagers</p>
                    </div>
                    <div class="tile-foot">
                        <span class="tile-go" aria-hidden="true">
                            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5"/></svg>
                        </span>
                        <span class="tile-record" data-record></span>
                    </div>
                </a>

                <a href="/craps-strategy/" class="tile tile--utility" data-game="craps-strategy">
                    <svg class="tile-mark" viewBox="0 0 100 100" aria-hidden="true"><use href="#suit-diamond"/></svg>
                    <div>
                        <h3 class="tile-title">Strategy Lab</h3>
                        <p class="tile-meta">Monte Carlo · 100 runs</p>
                    </div>
                    <div class="tile-foot">
                        <span class="tile-go" aria-hidden="true">
                            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5"/></svg>
                        </span>
                        <span class="tile-record" data-record></span>
                    </div>
                </a>
            </section>
        </div>
    </main>

    <footer>
        <div class="wrap footer-inner">
            <span>© 2026 Palmer Gill</span>
            <a href="/">palmergill.com</a>
        </div>
    </footer>

    <script src="/shared/site-nav.js?v=13"></script>
    <script src="/shared/analytics.js?v=1"></script>
    <script src="/shared/casino-profile.js?v=3"></script>
    <script>
        (function () {
            const profile = window.CasinoProfile;
            if (!profile) return;

            const panel = document.getElementById('yourHouse');
            if (!panel) return;

            const nameInput = document.getElementById('yourHouseName');
            const resetBtn = document.getElementById('yourHouseReset');
            const bankrollEl = document.getElementById('statBankroll');
            const handsEl = document.getElementById('statHands');
            const netEl = document.getElementById('statNet');
            const biggestEl = document.getElementById('statBiggest');
            const recordEls = document.querySelectorAll('.tile[data-game] .tile-record');

            function fmtMoney(n) {
                const sign = n < 0 ? '-' : '';
                return sign + '$' + Math.abs(Math.round(n)).toLocaleString();
            }

            function classifyMoney(el, value) {
                el.classList.remove('is-positive', 'is-negative');
                if (value > 0) el.classList.add('is-positive');
                else if (value < 0) el.classList.add('is-negative');
            }

            function render() {
                const bankroll = profile.getBankroll();
                const stats = profile.getAggregateStats();
                bankrollEl.textContent = fmtMoney(bankroll);
                handsEl.textContent = stats.totalHands.toLocaleString();
                netEl.textContent = fmtMoney(stats.netProfit);
                classifyMoney(netEl, stats.netProfit);
                biggestEl.textContent = fmtMoney(stats.biggestWin);

                // Per-game history rides on its own tile instead of a prose summary line.
                recordEls.forEach((el) => {
                    const game = el.closest('.tile').dataset.game;
                    const s = stats.byGame[game];
                    el.textContent = s && s.handsPlayed > 0
                        ? `${s.handsPlayed.toLocaleString()} ${s.handsPlayed === 1 ? 'hand' : 'hands'} · ${fmtMoney(s.netProfit)}`
                        : '';
                });
            }

            nameInput.value = profile.getDisplayName();
            nameInput.addEventListener('change', () => {
                const saved = profile.setDisplayName(nameInput.value);
                nameInput.value = saved;
            });

            resetBtn.addEventListener('click', () => {
                if (!window.confirm('Reset bankroll and stats across all casino games?')) return;
                profile.resetAll();
                nameInput.value = '';
                render();
            });

            panel.hidden = false;
            render();
            window.addEventListener('storage', (e) => {
                if (e.key && e.key.startsWith('casino-')) render();
            });
        })();
    </script>
</body>
</html>
