<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Palmer Gill</title>
    <meta name="description" content="Log in to palmergill.com for access to protected tools and saved casino bankrolls.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#faf6f0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/site-nav.css?v=14">
    <link rel="stylesheet" href="/login/style.css?v=5">
</head>
<body>
<noscript>
    <p class="site-noscript">This page builds its content with JavaScript, so it needs scripts enabled. <a href="/">Browse the other projects</a> in the meantime.</p>
</noscript>
    <main class="login-shell">
        <section class="login-card" aria-labelledby="loginTitle">
            <div class="login-brand">
                <img src="/assets/palmer-gill-logo-small.png" alt="" aria-hidden="true">
                <span>Palmer Gill</span>
            </div>

            <h1 id="loginTitle">Sign in</h1>

            <form class="login-form" id="loginForm" novalidate>
                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" autocomplete="username" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>

                <p class="status" id="loginStatus" role="status" aria-live="polite"></p>

                <button class="login-button" type="submit">
                    <span>Sign in</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"></path>
                        <path d="m13 6 6 6-6 6"></path>
                    </svg>
                </button>
            </form>

            <p class="login-alt" id="signupPrompt" hidden>
                Need an account? <a href="/signup/">Sign up</a>
            </p>
        </section>

        <a class="login-back" href="/">&larr; Back to palmergill.com</a>
    </main>

    <script src="/shared/site-nav.js?v=16"></script>
    <script src="/shared/analytics.js?v=1"></script>
    <script src="/login/app.js?v=3"></script>
</body>
</html>
