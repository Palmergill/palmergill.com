<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Texas Hold'em Poker</title>
    <meta name="description" content="Play Texas Hold'em poker against AI opponents or join a multiplayer table — by Palmer Gill.">
    <link rel="canonical" href="https://palmergill.com/poker/">
    <meta name="theme-color" content="#080a0d">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://palmergill.com/poker/">
    <meta property="og:title" content="Texas Hold'em Poker — Palmer Gill">
    <meta property="og:description" content="Play Texas Hold'em poker against AI opponents or join a multiplayer table.">
    <meta property="og:image" content="https://palmergill.com/assets/palmer-gill-logo.png">
    <meta property="og:image:width" content="960">
    <meta property="og:image:height" content="960">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Texas Hold'em Poker — Palmer Gill">
    <meta name="twitter:description" content="Play Texas Hold'em poker against AI opponents or join a multiplayer table.">
    <meta name="twitter:image" content="https://palmergill.com/assets/palmer-gill-logo.png">
    <link rel="stylesheet" href="/shared/site-nav.css?v=19">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/casino-theme.css?v=3">
    <link rel="stylesheet" href="/shared/rules-viewer.css?v=1">
    <link rel="stylesheet" href="style.css?v=26">
    <link rel="icon" type="image/png" href="/assets/palmer-gill-logo-small.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect fill='%230a0a0f' width='192' height='192' rx='24'/%3E%3Ctext x='96' y='130' font-size='100' text-anchor='middle'%3E🃏%3C/text%3E%3C/svg%3E">
    <script>
        // Register Service Worker for PWA support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((registration) => {
                        console.log('[PWA] Service Worker registered:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('[PWA] Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</head>
<body class="theme-casino">
<noscript>
    <p class="site-noscript">This page builds its content with JavaScript, so it needs scripts enabled. <a href="/">Browse the other projects</a> in the meantime.</p>
</noscript>
    <div id="casino-header-mount"></div>
    <div id="app" data-rules-app>
        <!-- Start Screen -->
        <div id="start-screen" class="screen active" data-rules-game-panel>
            <div class="start-card">
                <div class="logo" aria-hidden="true"><span class="suit-black">♠</span><span class="suit-red">♥</span><span class="suit-black">♣</span><span class="suit-red">♦</span></div>
                <h1>Texas Hold'em</h1>
                <nav class="rules-tab-list" aria-label="Texas Hold'em views">
                    <button class="rules-tab" type="button" data-rules-tab="game" role="tab" aria-selected="true">Play</button>
                    <button class="rules-tab" type="button" data-rules-tab="rules" data-rules-open role="tab" aria-selected="false">Rules</button>
                </nav>
                <div class="start-form">
                    <label class="sr-only" for="player-name">Player name</label>
                    <input type="text" id="player-name" placeholder="Your name" maxlength="12" value="Palmer">
                    <button id="start-btn" class="btn-primary">Play</button>
                    <details class="secondary-modes">
                        <summary>More modes</summary>
                        <button id="start-tournament-btn" class="btn-secondary">Sit &amp; Go</button>
                        <button id="create-multiplayer-btn" class="btn-secondary">Host table</button>
                        <button id="join-multiplayer-btn" class="btn-secondary">Join table</button>
                    </details>
                </div>
                <div class="game-info">
                    <span>6 seats</span>
                    <span>1,000 chips</span>
                    <span>10 / 20</span>
                </div>
                <button id="stats-btn" class="btn-ghost stats-entry">Statistics</button>
            </div>
        </div>

        <!-- Join Game Screen -->
        <div id="join-screen" class="screen" data-rules-game-panel>
            <div class="start-card">
                <div class="logo" aria-hidden="true"><span class="suit-black">♠</span><span class="suit-red">♥</span><span class="suit-black">♣</span><span class="suit-red">♦</span></div>
                <h1>Join Table</h1>
                <div class="start-form">
                    <label class="sr-only" for="join-game-id">Game ID</label>
                    <input type="text" id="join-game-id" placeholder="Game ID" maxlength="8">
                    <button id="join-btn" class="btn-primary">Join</button>
                    <button id="back-to-start" class="btn-ghost">Back</button>
                </div>
            </div>
        </div>

        <!-- Lobby Screen -->
        <div id="lobby-screen" class="screen" data-rules-game-panel>
            <div class="start-card">
                <div class="logo" aria-hidden="true"><span class="suit-black">♠</span><span class="suit-red">♥</span><span class="suit-black">♣</span><span class="suit-red">♦</span></div>
                <h1>Lobby</h1>
                <div class="start-form">
                    <p id="lobby-game-id" class="lobby-code"></p>
                    <div id="lobby-players" class="lobby-players">
                        <!-- Players list populated by JS -->
                    </div>
                    <p id="lobby-status" class="lobby-status">Waiting for players…</p>
                    <button id="start-multiplayer-btn" class="btn-primary hidden">Deal</button>
                    <button id="leave-lobby-btn" class="btn-ghost">Leave</button>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="loading-overlay hidden" data-rules-game-panel>
            <div class="spinner"></div>
            <div class="loading-text">Loading…</div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen" data-rules-game-panel>
            <div class="table-stage">
                <div class="table-hud">
                    <span class="hud-item">#<span id="hand-number">1</span></span>
                    <span class="hud-item hud-phase" id="phase" aria-live="polite">Preflop</span>
                    <span class="hud-item" id="hud-blinds">10 / 20</span>
                    <span class="hud-item hud-tournament" id="tournament-banner" hidden>
                        <span>Lv <strong id="tb-level">1</strong></span>
                        <span class="sr-only">Blinds <strong id="tb-blinds">10 / 20</strong></span>
                        <span>↑<strong id="tb-next">6</strong></span>
                        <span><strong id="tb-alive">6</strong> left</span>
                    </span>
                </div>
                <button class="hud-rules" type="button" data-rules-open aria-label="Rules">?</button>

                <div class="table">
                    <div class="table-felt">
                        <div class="table-center">
                            <div class="pot">
                                <span class="pot-label">Pot</span>
                                <span class="pot-value" id="pot-amount">0</span>
                            </div>
                            <div class="community-cards" id="community-cards">
                                <div class="card-slot" id="flop-1"></div>
                                <div class="card-slot" id="flop-2"></div>
                                <div class="card-slot" id="flop-3"></div>
                                <div class="card-slot" id="turn"></div>
                                <div class="card-slot" id="river"></div>
                            </div>
                        </div>
                    </div>
                    <div class="seats" id="opponents-row">
                        <!-- Opponents rendered by JS -->
                    </div>
                </div>
            </div>

            <!-- Your dock -->
            <div class="your-section">
                <div class="dock-hand">
                    <div class="your-cards" id="your-cards"></div>
                    <div class="dock-id">
                        <span class="your-name"><span id="your-name">Palmer</span><span class="your-position-chip" id="your-position-chip"></span></span>
                        <span class="your-chips" id="your-chips">1000</span>
                        <span class="hand-strength" id="hand-strength" aria-live="polite" aria-atomic="true"></span>
                    </div>
                </div>

                <div class="dock-controls">
                    <div class="decision-timer hidden" id="decision-timer">
                        <div class="timer-bar">
                            <div class="timer-fill" id="timer-fill" style="width: 100%"></div>
                        </div>
                        <span class="timer-text sr-only" id="timer-text">Your turn</span>
                    </div>

                    <!-- Action Buttons -->
                    <div class="actions" id="action-buttons">
                        <button class="btn-action btn-fold" id="btn-fold">Fold</button>
                        <button class="btn-action btn-call" id="btn-call">Call</button>
                        <button class="btn-action btn-raise" id="btn-raise">Raise</button>
                    </div>

                    <!-- Raise Controls -->
                    <div class="raise-container hidden" id="raise-container">
                        <div class="raise-sizing">
                            <button id="btn-min">Min</button>
                            <button id="btn-pot">Pot</button>
                            <button id="btn-allin">Max</button>
                        </div>
                        <div class="raise-slide">
                            <input type="range" class="raise-slider" id="raise-slider" min="0" max="1000" value="0" aria-label="Raise amount">
                            <div class="slider-labels">
                                <span class="slider-label" id="slider-min">Min: 0</span>
                                <span class="raise-amount-display" id="raise-display">0</span>
                                <span class="slider-label" id="slider-max">Max: 1000</span>
                            </div>
                        </div>
                        <div class="raise-actions">
                            <button class="btn-ghost" id="btn-cancel">Cancel</button>
                            <button class="btn-action btn-raise" id="btn-confirm-raise">Raise</button>
                        </div>
                    </div>
                </div>

                <div class="showdown-panel hidden" id="showdown-panel" aria-live="assertive" aria-atomic="true">
                    <button id="btn-dismiss-showdown" class="showdown-dismiss" type="button" aria-label="Dismiss result">×</button>
                    <div class="showdown-copy">
                        <div class="showdown-title" id="showdown-title">Hand complete</div>
                        <div class="showdown-details" id="showdown-details"></div>
                    </div>
                    <button id="btn-next-hand" class="btn-primary btn-ready">Next hand</button>
                </div>
            </div>

            <div class="ai-action-indicator sr-only" id="ai-action-indicator" aria-live="polite" aria-atomic="true"></div>
        </div>

        <div
            id="rules-screen"
            class="screen rules-screen"
            data-rules-panel
            data-rules-source="/casino/texas%20holdem%20rules.txt"
            data-rules-label="Texas Hold'em rules"
            aria-label="Texas Hold'em rules"
            hidden>
            <header class="rules-screen-header">
                <h1>Texas Hold'em Rules</h1>
                <nav class="rules-tab-list" aria-label="Rules navigation">
                    <button class="rules-tab" type="button" data-rules-tab="game" data-rules-close role="tab" aria-selected="true">Play</button>
                    <button class="rules-tab" type="button" data-rules-tab="rules" role="tab" aria-selected="false">Rules</button>
                </nav>
            </header>
            <div data-rules-content></div>
        </div>

        <!-- Stats Modal -->
        <div id="stats-modal" class="overlay hidden">
            <div class="result-content">
                <h2>Statistics</h2>
                <div id="stats-content">
                    <!-- Stats populated by JS -->
                </div>
                <div class="stats-actions">
                    <button id="btn-close-stats" class="btn-primary">Close</button>
                    <button id="btn-reset-stats" class="btn-ghost btn-danger">Reset</button>
                </div>
            </div>
        </div>

    </div>

    <script src="/shared/site-nav.js?v=23"></script>
    <script src="/shared/casino-profile.js?v=3"></script>
    <script src="/shared/casino-header.js?v=2"></script>
    <script>
        (function () {
            window.pokerCasinoHeader = window.CasinoHeader?.mount({
                game: 'poker', label: 'Poker', mount: '#casino-header-mount', chips: true
            });
            const savedName = window.CasinoProfile?.getDisplayName();
            const nameInput = document.getElementById('player-name');
            if (savedName && nameInput) nameInput.value = savedName;
        })();
    </script>
    <script src="/shared/analytics.js?v=1"></script>
    <script src="/shared/api-base.js?v=1"></script>
    <script src="/shared/rules-viewer.js?v=1"></script>
    <script src="app.js?v=21"></script>
</body>
</html>
