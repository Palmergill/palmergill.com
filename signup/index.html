<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account · Palmer Gill</title>
    <meta name="description" content="Create a palmergill.com account to save your casino bankroll and reach protected tools.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#faf6f0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/site-nav.css?v=14">
    <link rel="stylesheet" href="/login/style.css?v=5">
</head>
<body>
<noscript>
    <p class="site-noscript">This page builds its content with JavaScript, so it needs scripts enabled. <a href="/">Browse the other projects</a> in the meantime.</p>
</noscript>
    <main class="login-shell">
        <section class="login-card" aria-labelledby="signupTitle">
            <div class="login-brand">
                <img src="/assets/palmer-gill-logo-small.png" alt="" aria-hidden="true">
                <span>Palmer Gill</span>
            </div>

            <h1 id="signupTitle">Create account</h1>
            <p class="field-hint">Registration is open for up to five new accounts each day.</p>

            <form class="login-form" id="signupForm" novalidate>
                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" autocomplete="username" spellcheck="false" minlength="3" maxlength="24" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
                    <p class="field-hint">10+ characters. There's no reset, so save it.</p>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirm password</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
                </div>

                <p class="status" id="signupStatus" role="status" aria-live="polite"></p>

                <button class="login-button" type="submit">
                    <span>Create account</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"></path>
                        <path d="m13 6 6 6-6 6"></path>
                    </svg>
                </button>
            </form>

            <p class="login-alt">
                Already have an account? <a href="/login/">Sign in</a>
            </p>
        </section>

        <a class="login-back" href="/">&larr; Back to palmergill.com</a>
    </main>

    <script src="/shared/site-nav.js?v=16"></script>
    <script src="/shared/analytics.js?v=1"></script>
    <script src="/signup/app.js?v=4"></script>
</body>
</html>
